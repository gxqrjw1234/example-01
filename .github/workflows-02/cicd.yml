# ============================================================
# CI-CD Workflow — Python POC 验证与部署
# ============================================================
# 执行流程：
#   - push feature/* -> build-source-code -> build-push-image -> deploy-dev
#   - pull_request -> build-source-code -> build-source-code -> build-push-image -> deploy-dev -> deploy-uat

# ============================================================

name: CI-CD

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - '**.py'
      - '**.yml'
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - '**.py'
  #     - '**.yml'
  #   types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  PYTHON_VERSION_DEFAULT: '3.11'
  ARTIFACT_RETENTION_DAYS: 7

permissions: write-all

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-source-code:
    name: 'Build Python POC'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: python:3.11

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build application
        run: python src/build.py
        env:
          APP_ENV: production
      - name: Upload build artifact
        # if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  build-push-image:
    name: 'Build & Push Docker Image'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-source-code]
    # if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.image-meta.outputs.image_tag }}
      image_digest: ${{ steps.image-meta.outputs.image_digest }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.sha }}
          path: dist/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get build timestamp
        id: timestamp
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.created=${{ steps.timestamp.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64
      - name: Export image metadata
        id: image-meta
        env:
          PRIMARY_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          set -euo pipefail

          [[ "$DIGEST" == sha256:* ]] || { echo "Unexpected image digest: $DIGEST"; exit 1; }

          echo "image_tag=$PRIMARY_TAG" >> "$GITHUB_OUTPUT"
          echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"

          {
            echo "IMAGE_TAG=$PRIMARY_TAG"
            echo "IMAGE_DIGEST=$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: 'Deploy to Dev'
    needs: build-push-image
    # if: |
    #   github.event_name == 'pull_request' ||
    #   (github.event_name == 'push' && (github.ref_name == 'main' || startsWith(github.ref_name, 'feature/')))
    if: |
      github.ref_name == 'main' || startsWith(github.ref_name, 'feature/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/module-deployment.yml
    with:
      environment: dev
      image_tag: ${{ needs['build-push-image'].outputs.image_tag }}
      image_digest: ${{ needs['build-push-image'].outputs.image_digest }}
      source_branch: ${{ github.ref_name }}
    secrets:
      slack_webhook: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy-uat:
    name: 'Deploy to UAT'
    needs: [build-push-image, deploy-dev]
    # if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'main')
    if: github.ref_name == 'main'
    uses: ./.github/workflows/module-deployment.yml
    with:
      environment: uat
      image_tag: ${{ needs['build-push-image'].outputs.image_tag }}
      image_digest: ${{ needs['build-push-image'].outputs.image_digest }}
      source_branch: ${{ github.ref_name }}
    secrets:
      slack_webhook: ${{ secrets.SLACK_WEBHOOK_URL }}

  summary:
    name: 'Pipeline Summary'
    runs-on: ubuntu-latest
    needs: [build-source-code, build-push-image, deploy-dev, deploy-uat]
    if: always()

    steps:
      - name: Write pipeline summary to GitHub UI
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          | Stage | Result |
          |---|---|
          | Build | ${{ needs['build-source-code'].result == 'success' && 'PASS' || 'FAIL' }} |
          | Docker image | ${{ needs['build-push-image'].result == 'success' && 'PASS' || (needs['build-push-image'].result == 'skipped' && 'SKIPPED' || 'FAIL') }} |
          | Deploy Dev | ${{ needs['deploy-dev'].result == 'success' && 'PASS' || (needs['deploy-dev'].result == 'skipped' && 'SKIPPED' || 'FAIL') }} |
          | Deploy UAT | ${{ needs['deploy-uat'].result == 'success' && 'PASS' || (needs['deploy-uat'].result == 'skipped' && 'SKIPPED' || 'FAIL') }} |

          **Event:** `${{ github.event_name }}`
          **Commit:** `${{ github.sha }}`
          **Branch:** `${{ github.ref_name }}`
          **Actor:** @${{ github.actor }}
          **Run ID:** \`${{ github.run_id }}\`
          EOF

  notify-failure:
    name: 'Notify Pipeline Failure'
    runs-on: ubuntu-latest
    needs: [build-source-code, build-push-image, deploy-dev, deploy-uat]
    if: always() && failure()

    steps:
      - name: Send failure alert
        run: |
          echo "Sending pipeline failure alert..."
