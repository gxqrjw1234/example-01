# ============================================================
# CI-CD Workflow — Main branch validation and deployment
# ============================================================
# 执行流程：
#   - push main -> build-source-code -> build-push-image -> deploy-dev -> deploy-uat
#
# The build implementation is shared through reusable-build.yml.
# UAT is defined only in this workflow, so it is visible for main branch runs.

# ============================================================

name: CI-CD Main

on:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - '**.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION_DEFAULT: '3.11'
  ARTIFACT_RETENTION_DAYS: 7

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Build and Push Main Image'
    if: github.ref_name == 'main'
    uses: ./.github/workflows/reusable-build.yml
    with:
      python_version: '3.11'
      artifact_retention_days: 7
    permissions:
      contents: read
      packages: write

  deploy-dev:
    name: 'Deploy to Dev'
    needs: build
    if: github.ref_name == 'main'
    uses: ./.github/workflows/reusable-deployment.yml
    with:
      environment: dev
      image_tag: ${{ needs.build.outputs.image_tag }}
      image_digest: ${{ needs.build.outputs.image_digest }}
      source_branch: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
    secrets:
      slack_webhook: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy-uat:
    name: 'Deploy to UAT'
    needs: [build, deploy-dev]
    if: github.ref_name == 'main'
    uses: ./.github/workflows/reusable-deployment.yml
    with:
      environment: uat
      image_tag: ${{ needs.build.outputs.image_tag }}
      image_digest: ${{ needs.build.outputs.image_digest }}
      source_branch: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
    secrets:
      slack_webhook: ${{ secrets.SLACK_WEBHOOK_URL }}

  summary:
    name: 'Pipeline Summary'
    runs-on: ubuntu-latest
    needs: [build, deploy-dev, deploy-uat]
    if: always()
    steps:
      - name: Write pipeline summary to GitHub UI
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          | Stage | Result |
          |---|---|
          | Build and Docker image | ${{ needs.build.result == 'success' && 'PASS' || (needs.build.result == 'skipped' && 'SKIPPED' || 'FAIL') }} |
          | Deploy Dev | ${{ needs['deploy-dev'].result == 'success' && 'PASS' || (needs['deploy-dev'].result == 'skipped' && 'SKIPPED' || 'FAIL') }} |
          | Deploy UAT | ${{ needs['deploy-uat'].result == 'success' && 'PASS' || (needs['deploy-uat'].result == 'skipped' && 'SKIPPED' || 'FAIL') }} |

          **Event:** `${{ github.event_name }}`
          **Commit:** `${{ github.sha }}`
          **Branch:** `${{ github.ref_name }}`
          **Actor:** @${{ github.actor }}
          **Run ID:** \`${{ github.run_id }}\`
          EOF

  notify-failure:
    name: 'Notify Pipeline Failure'
    runs-on: ubuntu-latest
    needs: [build, deploy-dev, deploy-uat]
    if: always() && failure()
    steps:
      - name: Send failure alert
        run: echo "Sending pipeline failure alert..."
