name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - '**.py'
      - '**.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  PYTHON_VERSION_DEFAULT: '3.11'
  ARTIFACT_RETENTION_DAYS: 7

permissions: write-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-source-code:
    name: 'Build Python POC'
    runs-on: ubuntu-latest
    container:
      image: python:3.11

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # cache 在 job 运行时会恢复到 runner 上使用。 但长期通常不是存在 runner 本地，而是存在 Actions cache backend

      # - name: Setup Python with cache
      #   uses: ./.github/actions/setup-python-cached
      #   with:
      #     python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      # Replaced by container: image: python:3.11 
      # - name: Setup Python with cache
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
      #     cache: pip
      #     cache-dependency-path: requirements.txt

      - name: Build application
        run: python src/build.py
        env:
          APP_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  build-push-image:
    name: 'Build & Push Docker Image'
    runs-on: ubuntu-latest
    needs: [build-source-code]
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get build timestamp
        id: timestamp
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.created=${{ steps.timestamp.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64

      - name: Write image metadata artifact
        env:
          PRIMARY_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          # set -euo pipefail
          mkdir -p image-meta
          {
            echo "IMAGE_TAG=$PRIMARY_TAG"
            echo "IMAGE_DIGEST=$DIGEST"
          } > image-meta/meta.env

          {
            echo "IMAGE_TAG=$PRIMARY_TAG"
            echo "IMAGE_DIGEST=$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image metadata artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-meta-${{ github.sha }}
          path: image-meta/meta.env
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  summary:
    name: 'CI Summary'
    runs-on: ubuntu-latest
    needs: [build-source-code, build-push-image]
    if: always()

    steps:
      - name: Write CI summary to GitHub UI
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          | Build | ${{ needs['build-source-code'].result == 'success' && 'PASS' || 'FAIL' }} |
          | Docker image | ${{ needs['build-push-image'].result == 'success' && 'PASS' || (needs['build-push-image'].result == 'skipped' && 'SKIPPED' || 'FAIL') }} |

          **Commit:** `${{ github.sha }}`
          **Branch:** `${{ github.ref_name }}`
          **Actor:** @${{ github.actor }}
          **CI Run ID:** \`${{ github.run_id }}\` 
          EOF
