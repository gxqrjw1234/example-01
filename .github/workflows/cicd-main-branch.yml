name: CICD Main branch
run-name: ${{ github.run_id }}
# run-name: ${{ github.run_number }}

on:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - '**.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION_DEFAULT: '3.11'
  ARTIFACT_RETENTION_DAYS: 7

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Build and Push Main Image'
    # if: github.ref_name == 'main'
    uses: ./.github/workflows/reusable-build.yml
    with:
      python_version: '3.11'
      artifact_retention_days: 7
    permissions:
      contents: read
      packages: write

  deploy-dev:
    # name: 'Deploy to Dev'
    needs: build
    # if: github.ref_name == 'main'
    uses: ./.github/workflows/reusable-deployment.yml
    with:
      environment: dev
      image_tag: ${{ needs.build.outputs.image_tag }}
      image_digest: ${{ needs.build.outputs.image_digest }}
      source_branch: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
    secrets:
      slack_webhook: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy-uat:
    # name: 'Deploy to UAT'
    needs: [build, deploy-dev]
    if: github.ref_name == 'main'
    uses: ./.github/workflows/reusable-deployment.yml
    with:
      environment: uat
      image_tag: ${{ needs.build.outputs.image_tag }}
      image_digest: ${{ needs.build.outputs.image_digest }}
      source_branch: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
    secrets:
      slack_webhook: ${{ secrets.SLACK_WEBHOOK_URL }}

  notify-failure:
    name: 'Notify Pipeline Failure'
    runs-on: ubuntu-latest
    needs: [build, deploy-dev, deploy-uat]
    if: always() && failure()
    steps:
      - name: Send failure alert
        run: echo "Sending pipeline failure alert..."
