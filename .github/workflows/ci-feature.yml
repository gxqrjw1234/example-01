# ============================================================
# CI-CD Workflow — Python POC 验证与部署
# ============================================================
# 执行流程：
#   - push feature/* -> build-source-code -> build-push-image -> deploy-dev
#   - pull_request -> build-source-code -> build-source-code -> build-push-image -> deploy-dev
#
# The build implementation is shared through reusable-build.yml.
# UAT is intentionally not defined in this workflow, so it is not displayed for feature branches.

# ============================================================

name: CI-CD Feature

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - '**.py'
      - '**.yml'
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - '**.py'
  #     - '**.yml'
  #   types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  PYTHON_VERSION_DEFAULT: '3.11'
  ARTIFACT_RETENTION_DAYS: 7

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Build and Push Feature Image'
    if: startsWith(github.ref_name, 'feature/')
    uses: ./.github/workflows/reusable-build.yml
    with:
      python_version: '3.11'
      artifact_retention_days: 7
    permissions:
      contents: read
      packages: write

  deploy-dev:
    name: 'Deploy to Dev'
    needs: build
    if: startsWith(github.ref_name, 'feature/')
    uses: ./.github/workflows/reusable-deployment.yml
    with:
      environment: dev
      image_tag: ${{ needs.build.outputs.image_tag }}
      image_digest: ${{ needs.build.outputs.image_digest }}
      source_branch: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
    secrets:
      slack_webhook: ${{ secrets.SLACK_WEBHOOK_URL }}

  summary:
    name: 'Pipeline Summary'
    runs-on: ubuntu-latest
    needs: [build, deploy-dev]
    if: always()
    steps:
      - name: Write pipeline summary to GitHub UI
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          | Stage | Result |
          |---|---|
          | Build and Docker image | ${{ needs.build.result == 'success' && 'PASS' || (needs.build.result == 'skipped' && 'SKIPPED' || 'FAIL') }} |
          | Deploy Dev | ${{ needs['deploy-dev'].result == 'success' && 'PASS' || (needs['deploy-dev'].result == 'skipped' && 'SKIPPED' || 'FAIL') }} |

          **Event:** `${{ github.event_name }}`
          **Commit:** `${{ github.sha }}`
          **Branch:** `${{ github.ref_name }}`
          **Actor:** @${{ github.actor }}
          **Run ID:** \`${{ github.run_id }}\`
          EOF

  notify-failure:
    name: 'Notify Pipeline Failure'
    runs-on: ubuntu-latest
    needs: [build, deploy-dev]
    if: always() && failure()
    steps:
      - name: Send failure alert
        run: echo "Sending pipeline failure alert..."
