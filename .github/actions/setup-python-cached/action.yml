name: 'Setup Python with Cache'
description: 'Install Python, restore pip cache, and install POC dependencies'

inputs:
  python-version:
    description: 'Python version, for example 3.11'
    required: false
    default: '3.11'
  working-directory:
    description: 'Python project directory'
    required: false
    default: '.'
  install:
    description: 'Whether to install requirements.txt'
    required: false
    default: 'true'

outputs:
  python-version:
    description: 'Installed Python version'
    value: ${{ steps.setup-python.outputs.python-version }}

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: '${{ inputs.working-directory }}/requirements.txt'

    - name: Install Python dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: python -m pip install -r requirements.txt
