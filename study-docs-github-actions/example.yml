  summary:
    name: 'Pipeline Summary'
    runs-on: ubuntu-latest
    needs: [build, deploy-dev]
    if: always()
    steps:
      - name: Write pipeline summary to GitHub UI
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          | Stage | Result |
          |---|---|
          | Build and Docker image | ${{ needs.build.result == 'success' && 'PASS' || (needs.build.result == 'skipped' && 'SKIPPED' || 'FAIL') }} |
          | Deploy Dev | ${{ needs['deploy-dev'].result == 'success' && 'PASS' || (needs['deploy-dev'].result == 'skipped' && 'SKIPPED' || 'FAIL') }} |

          **Event:** `${{ github.event_name }}`
          **Commit:** `${{ github.sha }}`
          **Branch:** `${{ github.ref_name }}`
          **Actor:** @${{ github.actor }}
          **Run ID:** \`${{ github.run_id }}\`
          EOF

