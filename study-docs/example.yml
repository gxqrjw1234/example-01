name: CD

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches:
      - 'feature/**'
      - 'main'

  workflow_dispatch:
    inputs:
      target_env:
        description: 'deployment environment'
        type: choice
        options: [dev, uat]
        default: dev
        required: true
      ci_run_id:
        description: 'CI workflow run ID to pull image metadata from (required for workflow_dispatch)'
        type: string
        required: true


jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo deploy