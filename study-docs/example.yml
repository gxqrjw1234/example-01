 deploy-dev:
    name: 'Deploy → Dev'
    needs: get-ci-image-info
    if: |
      # needs 默认要求 get-ci-image-info 成功，这里只判断来源分支。
      # always() &&
      # github.event_name == 'workflow_run' &&
      # github.event.workflow_run.conclusion == 'success' &&
      # needs['get-ci-image-info'].result == 'success' &&
      (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'feature/'))
    uses: ./.github/workflows/module-deployment.yml
    with:
      environment: dev
      image_tag: ${{ needs['get-ci-image-info'].outputs.image_tag }}
      image_digest: ${{ needs['get-ci-image-info'].outputs.image_digest }}
    secrets:
      slack_webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
